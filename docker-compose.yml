name: pageflare-redirect-demo
services:
  app:
    build: .
    ports: ["127.0.0.1:4331:3000"]
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret of at least 32 characters}
      MONGO_URI: mongodb://mongo:27017/pageflare_redirect_demo
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7.0
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongo-data:
